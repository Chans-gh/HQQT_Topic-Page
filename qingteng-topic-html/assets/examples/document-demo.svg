<svg xmlns="http://www.w3.org/2000/svg" width="640" height="800" viewBox="0 0 640 800" role="img" aria-label="合成文档记录，非真实交付证据"><style>text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif;fill:#17221E;font-size:16px}.h{font-size:26px;font-weight:700}.m{fill:#75817C;font-size:14px}</style><rect width="640" height="800" fill="#F5F7F6"/><rect x="24" y="24" width="592" height="752" rx="16" fill="#FFFFFF" stroke="#E7ECE9"/><text class="m" x="56" y="72">合成记录 · 文档排版示意</text><text class="h" x="56" y="126">工作分析记录</text><path d="M56 154h528" stroke="#09B879" stroke-width="2"/><text x="56" y="204">一、问题范围</text><text x="56" y="246">明确要回答的问题，以及本次分析的边界。</text><text x="56" y="320">二、材料与口径</text><text x="56" y="362">保留输入、单位、统计范围与来源记录。</text><text x="56" y="436">三、判断与依据</text><text x="56" y="478">区分观察到的事实、解释和待验证内容。</text><text x="56" y="552">四、后续行动</text><text x="56" y="594">记录下一步要核对什么，以及完成条件。</text><rect x="56" y="660" width="528" height="64" rx="16" fill="#EAFAF4"/><text x="72" y="698">这份文档只用于版式示范，不代表业务验收。</text></svg>
