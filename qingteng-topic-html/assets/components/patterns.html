<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>环球青藤语义组件片段</title>
<!-- 开发参考，非交付专题。每个template是可编辑主体示例，不自动渲染、不代表真实业务信息。
选择实际关系，替换示意文案；模块用稳定M编号。主开场另加一个H1，组件内H2/H3层级不变。
按需要复制片段内容到任务body.html，不复制整个文件；去掉可选槽，数量按真实数组展开。
所有正文必须在data-module-id根节点内；正文来源由record.modules.sources生成；媒体只留空data-media-id槽。
-->
<template id="C01"><section class="qt-section" data-module-id="M01"><h2>同级信息</h2><div class="qt-t-group" data-qt-group><article class="qt-t-card"><h3>对象名称</h3><p>该对象的具体说明。</p></article><article class="qt-t-card"><h3>另一对象</h3><p>与前项同级，不暗示先后。</p></article></div></section></template>
<template id="C02"><section class="qt-section" data-module-id="M01"><h2>观点与依据</h2><div class="qt-t-paper qt-t-fit" data-qt-fit="pair"><div class="qt-t-stack"><h3>主张</h3><p>有边界的具体判断。</p></div><div class="qt-t-stack"><h3>依据</h3><p>可以核对的证据及适用条件。</p><p>另一条独立依据。</p></div></div></section></template>
<template id="C03"><section class="qt-section" data-module-id="M01"><h2>组成拆解</h2><div class="qt-t-paper qt-t-fit" data-qt-fit="prose"><div class="qt-t-stack"><h3>整体</h3><p>说明组成项如何协作，不添加不存在的时序。</p></div></div><div class="qt-t-group" data-qt-group><article class="qt-t-card"><h3>组成名称</h3><p>该部分承担的作用。</p></article></div></section></template>
<template id="C04"><section class="qt-section" data-module-id="M01"><h2>同维度比较</h2><div class="qt-t-paper qt-t-rows"><div class="qt-t-row"><h3>维度名称</h3><p><strong>对象A：</strong>同口径的值与条件。</p><p><strong>对象B：</strong>同口径的值与条件。</p></div></div><p>根据实际维度说明选择依据。</p></section></template>
<template id="C05"><section class="qt-section" data-module-id="M01"><h2>问题诊断</h2><div class="qt-t-flow"><div class="qt-t-card"><h3>观察到的现象</h3><p>已有材料支持的观察。</p></div><div class="qt-t-card"><h3>判断</h3><p>标明推断条件，不冒充实测。</p></div><div class="qt-t-card"><h3>对应处理</h3><p>针对该判断的可执行动作。</p></div></div></section></template>
<template id="C06"><section class="qt-section" data-module-id="M01"><h2>指标与解读</h2><div class="qt-t-group" data-qt-group><article class="qt-t-card"><h3>指标名称</h3><p class="qt-t-metric">实际数值 <span class="qt-t-unit">实际单位</span></p><p>统计范围与时间。</p><p>数值的解释与边界。</p></article></div></section></template>
<template id="C07"><section class="qt-section" data-module-id="M01"><h2>有序步骤</h2><ol class="qt-t-flow"><li class="qt-t-paper"><h3>步骤名称</h3><p>具体动作。</p><p><strong>完成条件：</strong>能核对的产物。</p></li></ol></section></template>
<template id="C08"><section class="qt-section" data-module-id="M01"><h2>时间线</h2><ol class="qt-t-flow"><li class="qt-t-paper"><p>真实阶段或日期</p><h3>对应事件</h3><p>该阶段产物；缺真实日期时不虚构日期。</p></li></ol></section></template>
<template id="C09"><section class="qt-section" data-module-id="M01"><h2>材料与解释</h2><div class="qt-t-paper qt-t-fit" data-qt-fit="media"><div data-media-id="IMG-01"></div><div class="qt-t-stack"><h3>材料中的可见信息</h3><p>与原图对应的解释；批注编号须与图中一致。</p></div></div></section></template>
<template id="C10"><section class="qt-section" data-module-id="M01"><h2>引用与核对记录</h2><div class="qt-t-paper qt-t-rows"><div class="qt-t-row"><p><strong>对象：</strong>具体材料。</p><p><strong>核对项：</strong>可执行的检查。</p><p><strong>状态：</strong>真实状态与原因。</p></div></div></section></template>
<template id="C11"><section class="qt-section" data-module-id="M01"><h2>双轴判断</h2><p>轴A：高/低；轴B：高/低。需换成真实轴含义。</p><div class="qt-t-quadrants"><article class="qt-t-card"><h3>A高 / B高</h3><p>该组合的含义与行动。</p></article><article class="qt-t-card"><h3>A低 / B高</h3><p>该组合的含义与行动。</p></article><article class="qt-t-card"><h3>A高 / B低</h3><p>该组合的含义与行动。</p></article><article class="qt-t-card"><h3>A低 / B低</h3><p>该组合的含义与行动。</p></article></div></section></template>
<template id="C12"><section class="qt-section" data-module-id="M01"><h2>关系模块</h2><div class="qt-t-flow"><p>根问题：依据真实条件选路径。</p><div class="qt-t-group" data-qt-group><article class="qt-t-card"><h3>条件A → 路径A</h3><p>满足该条件时的动作。</p></article><article class="qt-t-card"><h3>条件B → 路径B</h3><p>满足另一条件时的动作，不暗示先做A再做B。</p></article></div></div></section></template>
<!-- C12其他关系按以下语义组织，均可连续阅读，不能只靠画箭头： -->
<template id="relation-parallel"><div class="qt-t-flow"><h3>共同目标</h3><p>以下事项并行，无先后顺序。</p><div class="qt-t-group" data-qt-group><p>实际并行事项</p></div><p>汇合产物：只在确有共同产物时提供。</p></div></template>
<template id="relation-dependency"><div class="qt-t-flow"><p>前置条件：可核对的必要条件。</p><p>依赖于以上条件 → 可执行事项。</p></div></template>
<template id="relation-loop"><ol class="qt-t-flow"><li>本轮起点与输入。</li><li>处理与核对。</li><li>未满足终止条件时，返回本轮起点；满足时输出产物。</li></ol></template>
<template id="relation-before-after"><div class="qt-t-row"><h3>共同维度</h3><p><strong>调整前：</strong>已知状态。</p><p><strong>调整后：</strong>已知变化。</p></div></template>
<!-- 人物是整组引导，通常每组一个；正文/操作先于人物，矩形安全槽分离。 -->
<template id="person-guide"><div class="qt-t-paper qt-t-fit" data-qt-fit="person"><div class="qt-t-stack"><h3>组级引导</h3><p>与本组内容相关的说明，人物不承担唯一的信息入口。</p></div><div data-media-id="IMG-01"></div></div></template>
<!-- 横滑用于独立陈列；纵滑只用于重复记录或长图，必要结论/操作须在外部。空集合只放<p data-qt-empty>暂无内容</p>，不计作项目。 -->
<template id="local-scroll"><div class="qt-t-scroll" data-axis="x" data-expanded="false"><p>独立对象集合，可局部横向浏览或完整展开。</p><div class="qt-t-scroll-controls"><button class="qt-btn qt-btn-secondary" type="button" data-scroll-prev>上一组</button><span data-scroll-status role="status"></span><button class="qt-btn qt-btn-secondary" type="button" data-scroll-next>下一组</button><button class="qt-btn qt-btn-secondary" type="button" data-scroll-expand aria-expanded="false">完整展开</button></div><div class="qt-t-scroll-viewport" tabindex="0" role="region" aria-label="独立对象集合"><article class="qt-t-card"><h3>真实对象</h3><p>对应说明。</p></article></div></div></template>
</html>
